[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insure-search"
version = "0.1.0"
description = "Semantic search foundation for insurance documents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Insure Search Contributors" }]
dependencies = [
    "docling>=2.150.1",
    "flagembedding>=1.4.2",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insure_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
